---
spring:
  application:
    name: connessioni


    datasource:
    # Ogni servizio ha il suo database unico 
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/connessioni_db
    username: postgres
    password: password

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instanceId: ${spring.application.name}-${spring.cloud.client.hostname}-${random.value}
        healthCheckPath: /actuator/health
        healthCheckInterval: 10s
        healthCheckCriticalTimeout: 45s
        queryPassing: true
    loadbalancer:
      ribbon.enabled: false

  jpa:
    open-in-view: false
    show-sql: true  # decommentare per log SQL
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: "kafka:9092"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  #  consumer:
  #    group-id: connessioni-group
  #    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  #    properties:
  #      spring.json.trusted.packages: asw.bettermusic.*

server:
  port: ${PORT:${SERVER_PORT:0}}
  forward-headers-strategy: framework
