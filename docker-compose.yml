name: bettermusic

services:
  consul:
    image: docker.io/hashicorp/consul:latest
    ports:
      - "8500:8500"

  album-db:
    image: postgres:16-alpine
    container_name: album-db
    environment:
      POSTGRES_DB: album_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - album_db_data:/var/lib/postgresql/data

# Definizione dei volumi per non perdere i dati al riavvio
volumes:
  album_db_data: