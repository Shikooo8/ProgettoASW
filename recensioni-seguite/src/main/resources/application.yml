---
spring:
  application:
    name: recensioni-seguite

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instanceId: ${spring.application.name}-${spring.cloud.client.hostname}-${random.value}
        healthCheckPath: /actuator/health
        healthCheckInterval: 10s
        healthCheckCriticalTimeout: 45s
        queryPassing: true
    loadbalancer:
      ribbon:
        enabled: false

#  datasource:
#    url: jdbc:h2:mem:recensioniseguitedb
#    driver-class-name: org.h2.Driver
#    username: sa
#    password:

  jpa:
#    hibernate:
#      ddl-auto: update
    open-in-view: false # disabilita OSIV, evita problemi con lazy loading

  kafka:
    bootstrap-servers: "kafka:9092"
    consumer:
      group-id:  ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: asw.bettermusic.* 

server:
  port: ${PORT:${SERVER_PORT:0}} # dinamico, prende PORT o SERVER_PORT o porta casuale
  forward-headers-strategy: framework # utile dietro API Gateway

asw:
  recensioniseguiteservice:
    implementation: RecensioniSeguiteServiceKafkaBasedImpl
    # implementation alternativa: RecensioniSeguiteServiceKafkaBasedImpl
